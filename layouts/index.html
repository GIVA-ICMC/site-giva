{{ define "main" }}
<section class="hero">
  <div class="container">
    {{ with .Params.heroImage }}
      {{ $img := resources.Get (printf "media/%s" .) }}
      {{ if $img }}
        <img src="{{ $img.RelPermalink }}" alt="{{ $.Site.Title }}" class="hero-logo">
      {{ end }}
    {{ end }}
    <h1>{{ .Site.Title }}</h1>
    {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
    {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  </div>
</section>
{{ end }}
